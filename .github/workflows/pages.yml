# Publie FuelMap sur GitHub Pages et rafraîchit les prix des pays voisins toutes les 3 h.
# Réglage à faire une fois : Settings → Pages → Source = « GitHub Actions ».
name: Publier FuelMap
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/optimizer.test.js
      # Le dossier data/ n'est pas dans git : sans cette étape, une source en panne (HTTP 504 de l'État le 3/11 à 3 h) donnait un site
      # publié SANS ses prix pendant 3 h. On repart donc des fichiers déjà en ligne ; build-data.mjs ne remplace que ce qu'il réussit à refaire.
      - name: Reprendre les données déjà publiées
        run: |
          mkdir -p data/hist
          site=https://soaresden.github.io/FuelTrajetMap/data
          for f in fr es pt ad it fr-brands fr-habits radars; do curl -sfL --max-time 60 -o data/$f.json $site/$f.json || rm -f data/$f.json; done
          for d in $(seq -w 1 95); do echo $d; done | xargs -P 16 -I{} sh -c "curl -sfL --max-time 60 -o data/hist/{}.json $site/hist/{}.json || rm -f data/hist/{}.json"
          ls -la data; ls data/hist | wc -l
      - run: node tools/build-data.mjs
      - run: mkdir _site && cp -r index.html sw.js manifest.webmanifest privacy.html version-min.json css js icons vendor data _site/  # privacy.html : page exigée par le Play Store ; version-min.json : mise à jour obligatoire
      - uses: actions/configure-pages@v5
        with: { enablement: true }   # active GitHub Pages tout seul au premier passage
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
      # Contrôle de fraîcheur, en dernier (le site est publié quoi qu'il arrive) : si les prix français ont plus de 12 h, l'exécution
      # échoue et GitHub envoie un e-mail (à qui a modifié le planning en dernier) — sinon personne ne verrait que les prix vieillissent.
      - name: Prix assez récents ?
        # bloc « | » : la commande contient des « : », qu'une ligne YAML simple prendrait pour une clé (fichier illisible → workflow mort)
        run: |
          node -e "const j=require('./data/fr.json'); let d=0; j.list.forEach(x=>(x.m||[]).forEach(v=>{ if(v>d) d=v; })); const today=Math.floor(Date.now()/864e5), h=(Date.now()-j.ts)/36e5; console.log('Fichier refait il y a '+h.toFixed(1)+' h, prix le plus récent : jour '+d+' (aujourd hui : '+today+')'); if (!(h < 12) || d < today - 1) { console.error('Prix français trop anciens : la source officielle ne publie plus ?'); process.exit(1); }"
