# Publie FuelMap sur GitHub Pages et rafraîchit les prix des pays voisins toutes les 3 h.
# Réglage à faire une fois : Settings → Pages → Source = « GitHub Actions ».
name: Publier FuelMap
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/optimizer.test.js
      - run: node tools/build-data.mjs
      - run: mkdir _site && cp -r index.html sw.js manifest.webmanifest css js icons vendor data _site/
      - uses: actions/configure-pages@v5
        with: { enablement: true }   # active GitHub Pages tout seul au premier passage
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
