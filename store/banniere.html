<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FuelMap — image de présentation (1024×500)</title>
<style>
  /* Image de présentation du Play Store : capturée à 1024×500 par tests/captures-store.mjs */
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #0b1218; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; color: #eef3f6; position: relative;
    background: radial-gradient(900px 420px at 85% 30%, rgba(46, 204, 113, .22), transparent 60%), linear-gradient(135deg, #0d1a22 0%, #0b1218 55%, #10261d 100%); }
  .txt { position: absolute; left: 56px; top: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .brand b { font-size: 58px; font-weight: 800; letter-spacing: -1px; }
  .tag { font-size: 27px; font-weight: 700; line-height: 1.2; }
  .tag em { font-style: normal; color: #4ade80; }
  .pts { display: flex; flex-direction: column; gap: 6px; font-size: 18px; color: #c7d3da; }
  .shot { position: absolute; right: -70px; top: 50%; width: 580px; margin-top: -163px; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 48px rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.12); transform: rotate(-2deg); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="txt">
    <div class="brand"><img src="../icons/icon-512.png" alt=""><b>FuelMap</b></div>
    <div class="tag">Le plein <em>au meilleur prix</em>,<br>sur ta route.</div>
    <div class="pts"><span>⛽ Prix officiels, actualisés toutes les 3 h</span><span>🧭 Arrêts optimisés sur ton trajet</span><span>🚗 Sur l'écran de la voiture (Android Auto)</span></div>
  </div>
  <div class="shot"><img src="captures/voiture-1-carte.jpg" onerror="this.onerror=null;this.src='../docs/screens/voiture-carte.jpg'" alt=""></div>
</body>
</html>
